# fly.toml app configuration file generated for aiolists on 2025-06-16T11:15:41Z

app = 'aiolists'
primary_region = 'bom'

[image]
  ref = 'ghcr.io/sebastianmorel/aiolists:latest'

[http_service]
  internal_port = 7000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
